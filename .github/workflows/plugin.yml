# Tests the engine, checks that the Vencord plugin builds against current Vencord, and on a
# version tag (v1.2.3) publishes a GitHub release with the plugin zip and the install scripts.
name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Check that the bundled plugin engine is up to date
        run: |
          npm run vencord:build
          git diff --exit-code -- vencord/ || {
            echo "::error::vencord/uwuSpeak/engine.* is stale. Run 'npm run vencord:build' and commit the result."
            exit 1
          }

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected."
            exit 1
          }

      - name: Package the plugin
        run: |
          mkdir -p release
          (cd vencord && zip -r ../release/uwuSpeak.zip uwuSpeak)
          cp install/install.ps1 install/install.sh release/

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  vencord-build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Vendicated/Vencord
          path: Vencord

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Install the packaged plugin
        run: unzip -q release/uwuSpeak.zip -d Vencord/src/userplugins

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: Vencord/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: Vencord/pnpm-lock.yaml

      - name: Build Vencord with the plugin
        working-directory: Vencord
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          grep -q UwUSpeak dist/renderer.js || { echo "::error::The plugin is missing from the build."; exit 1; }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, vencord-build]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "UwUSpeak $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Install

          **Windows (PowerShell):**
          ```powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
          ```

          **Linux / macOS:**
          ```sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
          ```

          You need git and Node.js 22+. The script clones and builds Vencord from source (custom plugins can't be added to the prebuilt Vencord installer), adds the plugin, and patches Discord. Then enable **UwUSpeak** under *Settings → Vencord → Plugins*.

          Already have a Vencord source checkout? Unzip `uwuSpeak.zip` into its `src/userplugins` folder, then run `pnpm build`.
          EOF
          )"
