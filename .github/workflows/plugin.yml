# Tests the engine and the installer, runs the installer end to end on Windows, macOS and Linux
# (building the plugin into current Vencord and Equicord and patching a fake Discord), and on a
# version tag (v1.2.3) publishes a GitHub release with the plugin and the installers.
name: Plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Check that the bundled plugin engine is up to date
        run: |
          npm run vencord:build
          git diff --exit-code -- vencord/ || {
            echo "::error::vencord/uwuSpeak/engine.* is stale. Run 'npm run vencord:build' and commit the result."
            exit 1
          }

      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || {
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected."
            exit 1
          }

      - name: Package the plugin and installers
        run: |
          mkdir -p release
          (cd vencord && zip -qr ../release/uwuSpeak.zip uwuSpeak && tar -czf ../release/uwuSpeak.tar.gz uwuSpeak)
          cp install/installer.mjs install/install.ps1 install/install.sh install/UwUSpeak-Installer.cmd release/
          (cd release && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/

  installer:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows, no git, PowerShell 5.1
            os: windows-latest
          - name: Linux, git, update and Equicord
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      UWUSPEAK_PORTABLE_NODE: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Install into a fake Discord Canary (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          node tests/installer-e2e.mjs fake "$env:LOCALAPPDATA\DiscordCanary\app-1.0.9263\resources"
          node tests/installer-e2e.mjs fake "$env:LOCALAPPDATA\DiscordCanary\app-1.0.9264\resources"
          $env:UWUSPEAK_INSTALLER = "$pwd\release\installer.mjs"
          $env:UWUSPEAK_ARGS = "--yes --no-git --no-restart --target discord-canary --dir $env:RUNNER_TEMP\Vencord --plugin $pwd\release\uwuSpeak.tar.gz"
          iex (Get-Content -Raw release\install.ps1)
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with $LASTEXITCODE" }
          node tests/installer-e2e.mjs verify "$env:RUNNER_TEMP\Vencord" "$env:LOCALAPPDATA\DiscordCanary\app-1.0.9264\resources" "$env:APPDATA\Vencord\settings\settings.json"
          if ($LASTEXITCODE -ne 0) { throw 'Verification failed' }

      - name: Install into a fake Discord (Linux)
        if: runner.os == 'Linux'
        run: |
          node tests/installer-e2e.mjs fake ~/.config/discord/app-0.0.120/resources
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh \
            --yes --no-restart --target discord --dir "$RUNNER_TEMP/Vencord" --plugin "$PWD/release/uwuSpeak.tar.gz"
          node tests/installer-e2e.mjs verify "$RUNNER_TEMP/Vencord" ~/.config/discord/app-0.0.120/resources ~/.config/Vencord/settings/settings.json

      - name: Run again to update (Linux)
        if: runner.os == 'Linux'
        run: |
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh \
            --yes --no-restart --plugin "$PWD/release/uwuSpeak.tar.gz" | tee update.log
          grep -q "Vencord built from" update.log
          grep -q "Update UwUSpeak" update.log
          node tests/installer-e2e.mjs verify "$RUNNER_TEMP/Vencord"

      - name: Skip the rebuild when up to date (Linux)
        if: runner.os == 'Linux'
        run: |
          # The latest published release, then a second run that must find nothing to do.
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh --yes --target none --dir "$RUNNER_TEMP/Latest"
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh --yes --target none --dir "$RUNNER_TEMP/Latest" | tee skip.log
          grep -q "already installed and built" skip.log
          ! grep -q "Building Vencord" skip.log

      - name: Install into Equicord and a fake Discord PTB (Linux)
        if: runner.os == 'Linux'
        run: |
          node tests/installer-e2e.mjs fake ~/.config/discordptb/app-0.0.200/resources
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh \
            --yes --no-restart --target discord-ptb --client equicord --dir "$RUNNER_TEMP/Equicord" --plugin "$PWD/release/uwuSpeak.tar.gz"
          node tests/installer-e2e.mjs verify "$RUNNER_TEMP/Equicord" ~/.config/discordptb/app-0.0.200/resources ~/.config/Equicord/settings/settings.json

      - name: Drive the menus with the keyboard (Linux)
        if: runner.os == 'Linux'
        run: |
          # Down arrow + Enter picks "Uninstall"; Enter then accepts the default folder and "yes".
          { sleep 3; printf '\033[B'; sleep 1; printf '\r'; sleep 2; printf '\r'; sleep 1; printf 'n'; sleep 2; } |
            script -qefc "node release/installer.mjs --dry-run" /dev/null | tee tui.log
          grep -q "Uninstall UwUSpeak" tui.log
          grep -q "Dry run: nothing was changed" tui.log

      - name: Install into a fake Discord (macOS)
        if: runner.os == 'macOS'
        run: |
          node tests/installer-e2e.mjs fake ~/Applications/Discord.app/Contents/Resources
          UWUSPEAK_INSTALLER="$PWD/release/installer.mjs" bash release/install.sh \
            --yes --no-restart --target discord --dir "$RUNNER_TEMP/Vencord" --plugin "$PWD/release/uwuSpeak.tar.gz"
          node tests/installer-e2e.mjs verify "$RUNNER_TEMP/Vencord" ~/Applications/Discord.app/Contents/Resources ~/Library/Application\ Support/Vencord/settings/settings.json

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs-${{ runner.os }}
          path: |
            ~/.local/share/uwuspeak/logs
            ~/Library/Application Support/UwUSpeak/logs
            ~/AppData/Local/UwUSpeak/logs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, installer]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "UwUSpeak $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ## Install

          **Windows:** open PowerShell and run
          ```powershell
          irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
          ```
          or download and double-click **UwUSpeak-Installer.cmd** below.

          **Linux / macOS:**
          ```sh
          curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh | bash
          ```

          The installer finds Discord and Vesktop, works with an existing Vencord or Equicord install, and downloads whatever it needs (Node.js, pnpm, Vencord's source). Nothing else has to be installed first. Run it again to update.

          Building Vencord yourself? Extract `uwuSpeak.zip` into its `src/userplugins` folder and run `pnpm build`.
          EOF
          )"
